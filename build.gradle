plugins {
    id 'base'
}

group = project.maven_group
version = project.mod_version

tasks.named('clean').configure {
    dependsOn subprojects.collect { it.tasks.matching { it.name == 'clean' } }
}

def currentBuildTasks = subprojects.collect { subproject ->
    subproject.path == ':neoforge' ? "${subproject.path}:assemble" : "${subproject.path}:build"
}

tasks.register('buildMinecraft26_1', Exec) {
    dependsOn currentBuildTasks
    workingDir rootProject.file('mc26_1')
    commandLine rootProject.file('mc26_1/gradlew').absolutePath, 'assemble', '--no-daemon'
}

tasks.register('buildAll') {
    dependsOn tasks.named('buildMinecraft26_1')
}
