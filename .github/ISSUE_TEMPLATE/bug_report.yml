name: Ошибка в моде
description: Проблема установки, управления или сохранения групп.
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Версии
      description: Minecraft, загрузчик (с версией), PinChat и Java.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Шаги, ожидаемый и фактический результат.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Лог и снимки экрана
      description: Приложите logs/latest.log и снимок проблемы. Удалите личные данные перед публикацией.
  - type: textarea
    id: other_mods
    attributes:
      label: Другие моды
      description: Особенно моды чата, HUD и управления. Есть ли проблема только с PinChat и обязательными зависимостями?
