name: Client Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew -PtestPlatform=fabric :common:test :fabric:test --no-daemon
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Interact with PinChat in a singleplayer world
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 15m xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew -PtestPlatform=fabric :fabric:runClientGameTest --no-daemon --console=plain
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinchat-client-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            common/build/reports/tests/
            fabric/build/reports/tests/
            common/build/test-results/
            fabric/build/test-results/
            fabric/build/run/clientGameTest/logs/
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/crash-reports/
          if-no-files-found: warn
          retention-days: 14
