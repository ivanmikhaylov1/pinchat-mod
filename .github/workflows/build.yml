name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-tests:
    uses: ./.github/workflows/client-tests.yml

  build:
    needs: client-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build all supported loader artifacts
        run: ./gradlew buildAll --no-daemon
      - name: Verify packaged metadata
        run: python3 scripts/verify_loader_jars.py
      - name: Prepare named release files, checksums and notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/release.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/release.py
          fi
      - name: Gameplay target matrix
        id: targets
        run: echo "matrix=$(python3 scripts/release.py --matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pinchat-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  gameplay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-gameplay.txt
      - name: Install gameplay driver and virtual display
        run: |
          pip install -r scripts/requirements-gameplay.txt
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0 libasound2t64
      - uses: actions/download-artifact@v4
        with:
          name: pinchat-release-${{ github.sha }}
          path: dist/
      - uses: actions/cache@v4
        with:
          path: build/game-cache
          key: minecraft-game-assets-${{ runner.os }}-${{ matrix.minecraft }}-v1
      - name: Verify downloaded JAR checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Test release JAR in the world with native input and restart
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 25m xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/gameplay_client.py --loader '${{ matrix.loader }}' --minecraft-version '${{ matrix.minecraft }}'
      - name: Upload gameplay results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            build/gameplay/${{ matrix.loader }}-${{ matrix.minecraft }}/result.json
            build/gameplay/${{ matrix.loader }}-${{ matrix.minecraft }}/*.log
            build/gameplay/${{ matrix.loader }}-${{ matrix.minecraft }}/*.png
            build/gameplay/${{ matrix.loader }}-${{ matrix.minecraft }}/logs/
            build/gameplay/${{ matrix.loader }}-${{ matrix.minecraft }}/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, gameplay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinchat-release-${{ github.sha }}
          path: dist/
      - name: Verify checksums before publishing
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Collect verified gameplay reports
        uses: actions/download-artifact@v4
        with:
          pattern: gameplay-*
          path: gameplay-reports/
      - name: Attach machine-readable test evidence
        run: |
          python3 - <<'PY'
          import json, pathlib
          reports = [json.loads(p.read_text()) for p in pathlib.Path('gameplay-reports').rglob('result.json')]
          manifest = json.loads(pathlib.Path('dist/manifest.json').read_text())
          expected = {(r['loader'], r['minecraft']) for r in manifest['artifacts']}
          actual = {(r['target']['loader'], r['target']['minecraft']) for r in reports if r['status'] == 'passed'}
          if actual != expected or len(reports) != len(expected):
              raise SystemExit('Missing or failed gameplay reports')
          hashes = {r['file']: r['sha256'] for r in manifest['artifacts']}
          if any(hashes[r['jar']] != r['jar_sha256'] for r in reports):
              raise SystemExit('Gameplay evidence does not match release JARs')
          pathlib.Path('dist/GAMEPLAY_RESULTS.json').write_text(json.dumps(reports, indent=2) + '\n')
          PY
      - name: Publish verified release
        uses: softprops/action-gh-release@v2
        with:
          name: PinChat ${{ github.ref_name }} — Minecraft 1.21.11 / 26.1–26.1.2 / 26.2
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.jar
            dist/SHA256SUMS
            dist/manifest.json
            dist/GAMEPLAY_RESULTS.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
