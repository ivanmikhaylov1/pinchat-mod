name: Build and Release

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all supported loader artifacts
        run: ./gradlew buildAll --no-daemon
      - name: Verify 1.21.11 and 26.x loader JAR metadata
        run: python3 scripts/verify_loader_jars.py
      - name: Install virtual display for NeoForge smoke test
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool libgl1-mesa-dri
      - name: Smoke test NeoForge 1.21.11 client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/smoke_neoforge_client.py --require-window
      - name: Smoke test NeoForge 26.1 client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/smoke_neoforge_client.py --target 26.1 --require-window
      - name: Smoke test NeoForge 26.1.1 with shared 26.1 sources
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/smoke_neoforge_client.py --target 26.1 --neo-version 26.1.1.15-beta --require-window
      - name: Verify NeoForge 26.1.1 bytecode compatibility
        run: python3 scripts/verify_neo26_hotfix_bytecode.py
      - name: Smoke test NeoForge 26.1.2 with shared 26.1 sources
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/smoke_neoforge_client.py --target 26.1 --neo-version 26.1.2.109 --require-window
      - name: Verify NeoForge 26.1.2 bytecode compatibility
        run: python3 scripts/verify_neo26_hotfix_bytecode.py
      - name: Smoke test NeoForge 26.2 client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/smoke_neoforge_client.py --target 26.2 --require-window
      - name: Install Fabric/Quilt smoke launcher
        run: python3 -m venv .ci-smoke-venv && .ci-smoke-venv/bin/pip install minecraft-launcher-lib==8.0
      - name: Smoke test Fabric 26.1 client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader fabric
      - name: Smoke test Quilt 26.1 client with Fabric JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader quilt
      - name: Smoke test Fabric 26.1.1 with 26.1 JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader fabric --minecraft-version 26.1.1 --fabric-api-version 0.145.4+26.1.1
      - name: Smoke test Fabric 26.1.2 with 26.1 JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader fabric --minecraft-version 26.1.2 --fabric-api-version 0.155.3+26.1.2
      - name: Smoke test Quilt 26.1.1 with 26.1 Fabric JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader quilt --minecraft-version 26.1.1 --fabric-api-version 0.145.4+26.1.1
      - name: Smoke test Quilt 26.1.2 with 26.1 Fabric JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader quilt --minecraft-version 26.1.2 --fabric-api-version 0.155.3+26.1.2
      - name: Smoke test Fabric 26.2 client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader fabric --minecraft-version 26.2 --artifact-version 26.2 --fabric-api-version 0.161.0+26.2
      - name: Smoke test Quilt 26.2 client with Fabric JAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: timeout 20m xvfb-run -a -s '-screen 0 1280x720x24' .ci-smoke-venv/bin/python scripts/smoke_fabric_quilt26_client.py --loader quilt --minecraft-version 26.2 --artifact-version 26.2 --fabric-api-version 0.161.0+26.2
      - name: Verify Minecraft 26.x protocol and pack metadata
        run: python3 scripts/verify_minecraft26_version_metadata.py
      - name: Collect release jars
        shell: bash
        run: |
          set -euo pipefail
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mc_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          mkdir -p dist
          cp "fabric/build/libs/pinchat-mod-${mod_version}.jar" "dist/pinchat-mod-fabric-${mod_version}-mc${mc_version}.jar"
          cp "quilt/build/libs/pinchat-mod-quilt-${mod_version}.jar" "dist/pinchat-mod-quilt-${mod_version}-mc${mc_version}.jar"
          cp "forge/build/libs/pinchat-mod-forge-${mod_version}.jar" "dist/pinchat-mod-forge-${mod_version}-mc${mc_version}.jar"
          cp "neoforge/build/libs/pinchat-mod-neoforge-${mod_version}.jar" "dist/pinchat-mod-neoforge-${mod_version}-mc${mc_version}.jar"
          cp "neoforge-mc26/build/libs/pinchat-mod-neoforge-mc26.1-${mod_version}.jar" "dist/pinchat-mod-neoforge-${mod_version}-mc26.1.jar"
          cp "fabric-mc26/build/libs/pinchat-mod-fabric-mc26.1-${mod_version}.jar" "dist/pinchat-mod-fabric-${mod_version}-mc26.1.jar"
          cp "fabric-mc26/build/libs/pinchat-mod-fabric-mc26.1-${mod_version}.jar" "dist/pinchat-mod-quilt-${mod_version}-mc26.1.jar"
          cp "neoforge-mc26/build/libs/pinchat-mod-neoforge-mc26.2-${mod_version}.jar" "dist/pinchat-mod-neoforge-${mod_version}-mc26.2.jar"
          cp "fabric-mc26/build/libs/pinchat-mod-fabric-mc26.2-${mod_version}.jar" "dist/pinchat-mod-fabric-${mod_version}-mc26.2.jar"
          cp "fabric-mc26/build/libs/pinchat-mod-fabric-mc26.2-${mod_version}.jar" "dist/pinchat-mod-quilt-${mod_version}-mc26.2.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: pinchat-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
