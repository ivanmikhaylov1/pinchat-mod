name: Build and Release

on:
  push:
    branches: [master, '1.*', '26.*']
    tags: ['v*']
  pull_request:
    branches: [master, '1.*', '26.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all supported loader artifacts
        run: ./gradlew buildAll --no-daemon
      - name: Verify NeoForge and Quilt-compatible JAR metadata
        run: python3 scripts/verify_loader_jars.py
      - name: Install virtual display for NeoForge smoke test
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libgl1-mesa-dri
      - name: Smoke test NeoForge client
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/smoke_neoforge_client.py
      - name: Collect release jars
        shell: bash
        run: |
          set -euo pipefail
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mc_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          mkdir -p dist
          cp "fabric/build/libs/pinchat-mod-${mod_version}.jar" "dist/pinchat-mod-fabric-${mod_version}-mc${mc_version}.jar"
          cp "quilt/build/libs/pinchat-mod-quilt-${mod_version}.jar" "dist/pinchat-mod-quilt-${mod_version}-mc${mc_version}.jar"
          cp "forge/build/libs/pinchat-mod-forge-${mod_version}.jar" "dist/pinchat-mod-forge-${mod_version}-mc${mc_version}.jar"
          cp "neoforge/build/libs/pinchat-mod-neoforge-${mod_version}.jar" "dist/pinchat-mod-neoforge-${mod_version}-mc${mc_version}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: pinchat-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
