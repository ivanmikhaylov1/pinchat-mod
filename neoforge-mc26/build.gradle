plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

group = 'com.myname.pinchat'
version = mod_version
base.archivesName = "pinchat-mod-neoforge-mc${minecraft_version}"

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
}

def sharedRoot = projectDir.parentFile
def adaptGuiSource = { String line ->
    line.replace('net.minecraft.client.gui.GuiGraphics', 'net.minecraft.client.gui.GuiGraphicsExtractor')
        .replace('GuiGraphics context', 'GuiGraphicsExtractor context')
        .replace('context.drawCenteredString(', 'context.centeredText(')
        .replace('context.drawString(', 'context.text(')
        .replace('public void render(GuiGraphicsExtractor context', 'public void extractRenderState(GuiGraphicsExtractor context')
        .replace('super.render(context,', 'super.extractRenderState(context,')
}

def adaptVersionSource = { String line ->
    String result = adaptGuiSource(line.replace('GuiGraphicsExtractor', 'GuiGraphics'))
    if (minecraft_version == '26.2') {
        result = result.replace('client.screen', 'client.gui.screen()')
            .replace('Minecraft.getInstance().screen', 'Minecraft.getInstance().gui.screen()')
            .replace('this.minecraft.setScreen(', 'this.minecraft.gui.setScreen(')
            .replace('client.setScreen(', 'client.gui.setScreen(')
            .replace('Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen(')
            .replace('client.gui.getChat()', 'client.gui.hud.getChat()')
            .replace('client.options.hideGui', 'client.gui.hud.isHidden()')
    }
    result
}

tasks.register('syncModSources', Sync) {
    inputs.property 'minecraft_version', minecraft_version
    into layout.buildDirectory.dir('generated/pinchat/java')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/java') { filter { String line -> minecraft_version == '26.2' ? adaptVersionSource(line) : line } }
    from(new File(sharedRoot, 'neoforge/src/main/java')) {
        filter { String line -> adaptVersionSource(line) }
    }
    from(new File(sharedRoot, 'common/src/mojang/java')) {
        filter { String line -> adaptVersionSource(line) }
    }
    from new File(sharedRoot, 'common/src/main/java')
}

sourceSets.main.java.setSrcDirs([])
sourceSets.main.java.srcDir tasks.named('syncModSources')
sourceSets.main.resources.srcDir new File(sharedRoot, 'neoforge/src/main/resources')

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'mod_version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'minecraft_dependency', minecraft_version == '26.1' ? '[26.1,26.2)' : "[${minecraft_version}]"
    inputs.property 'pack_format', pack_format
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version, minecraft_dependency: minecraft_version == '26.1' ? '[26.1,26.2)' : "[${minecraft_version}]"
    }
    filesMatching('pack.mcmeta') { expand pack_format: pack_format }
}
