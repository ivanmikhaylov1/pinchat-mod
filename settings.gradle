pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}
rootProject.name = "pinchat-mod"
// A focused test run need not resolve Forge/NeoForge or Java 25 tooling.
def testPlatform = providers.gradleProperty('testPlatform').orNull
if (testPlatform != null && !(testPlatform in ['common', 'fabric'])) {
    throw new GradleException('testPlatform must be common or fabric')
}
include 'common'
if (testPlatform != 'common') {
    include 'fabric'
}
if (testPlatform == null) {
    include 'forge', 'neoforge', 'quilt', 'java25-toolchain-check'
}
